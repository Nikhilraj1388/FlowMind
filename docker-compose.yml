# FlowMind Local Development Services
# Start: docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v (deletes data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowmind-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: flowmind
      POSTGRES_DB: flowmind_dev
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command: >
      postgres -c password_encryption=md5 -c hba_file=/etc/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/pg_hba.conf:/etc/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
